<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">

  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="container">

    <div class="top-bar">
      <h1>Expense Tracker</h1>
      <div class="top-right">
        <p id="welcomeUser"></p>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>

    <!-- Add Expense -->
    <div class="form-section">
      <h2>Add Expense</h2> 

      <form id="expenseForm">
        <input type="text" id="expenseTitle" placeholder="Expense Title" required>
        <input type="number" id="expenseAmount" placeholder="Amount" required>

        <select id="expenseCategory" required>
          <option value="">Select Category</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Investment">Investment</option>
          <option value="College fees">College fees</option>
          <option value="Others">Others</option>
        </select>

        <input type="date" id="expenseDate" required>

        <button type="submit">Add Expense</button>
      </form>
    </div>

    <!-- Total Expense -->
    <div class="summary-section">
      <h2>Total Expense: ₹ <span id="totalExpense">0</span></h2>
    </div>

    <!-- Monthly Report -->
    <div class="report-section">
      <h2>Monthly Report</h2>

      <select id="monthSelect">
        <option value="">Select Month</option>
        <option value="01">January</option>
        <option value="02">February</option>
        <option value="03">March</option>
        <option value="04">April</option>
        <option value="05">May</option>
        <option value="06">June</option>
        <option value="07">July</option>
        <option value="08">August</option>
        <option value="09">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
      </select>

      <button id="generateReportBtn">Generate Report</button>

      <h3>Monthly Total: ₹ <span id="monthlyTotal">0</span></h3>

      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="monthlyReportList"></tbody>
      </table>
    </div>

    <!-- Charts -->
    <div class="chart-section">
      <h2>Expense Charts</h2>

      <div class="charts">
        <div class="chart-box">
          <h3>Category Wise Expense</h3>
          <canvas id="categoryChart"></canvas>
        </div>

        <div class="chart-box">
          <h3>Monthly Expense</h3>
          <canvas id="monthlyChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Expense List -->
    <div class="list-section">
      <h2>Expense List</h2>

      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="expenseList"></tbody>
      </table>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
